<!DOCTYPE html>
<html lang="en">
<head>
    <title>NeuralNet Studio | Interactive AI Learning Platform</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Experience neural network learning in real-time with our beautiful interactive visualization platform">
    
    <!-- Google Fonts - Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        function popup(x, y, value) {
            let popup = document.querySelector(".popup");
            popup.classList.remove("hidden");
            popup.style.position = "absolute";
            popup.style.top = (y + 10) + "px";
            popup.style.left = (x + 10) + "px";
            popup.style.background = "linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.95))";
            popup.style.border = "1px solid rgba(139, 92, 246, 0.5)";
            popup.style.padding = "16px";
            popup.style.borderRadius = "16px";
            popup.style.boxShadow = "0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(139, 92, 246, 0.15)";
            popup.style.zIndex = "1000";
            popup.style.color = "#e2e8f0";
            popup.style.fontSize = "13px";
            popup.style.fontFamily = "'JetBrains Mono', monospace";
            popup.style.backdropFilter = "blur(20px)";

            value = JSON.stringify(value, null, 2);
            popup.innerHTML = "<pre style='margin:0; color: #a5b4fc;'>" + value + "</pre>";
            document.body.appendChild(popup);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        import { Neuron, InitialNeuron, OutputNeuron } from "../src/Neuron.js";
        import { Layer, OutputLayer, InputLayer } from "../src/Layer.js";
        import { Network } from "../src/Network.js";
        import { NetworkGraph } from "../src/NetworkGraph.js";

        let resizeTimeout;
        let trainingInterval = null;
        let network = null;
        let networkGraph = null;
        let epoch = 0;
        let isTraining = false;

        // XOR problem - a classic neural network learning challenge
        const xorSamples = [
            {"input": [0, 0], "target": 0},
            {"input": [0, 1], "target": 1},
            {"input": [1, 0], "target": 1},
            {"input": [1, 1], "target": 0}
        ];

        // AND gate samples
        const andSamples = [
            {"input": [0, 0], "target": 0},
            {"input": [0, 1], "target": 0},
            {"input": [1, 0], "target": 0},
            {"input": [1, 1], "target": 1}
        ];

        // OR gate samples
        const orSamples = [
            {"input": [0, 0], "target": 0},
            {"input": [0, 1], "target": 1},
            {"input": [1, 0], "target": 1},
            {"input": [1, 1], "target": 1}
        ];

        // Custom samples (user editable)
        let customSamples = [
            {"input": [0, 0], "target": 0},
            {"input": [0, 1], "target": 1},
            {"input": [1, 0], "target": 1},
            {"input": [1, 1], "target": 0}
        ];

        let currentSamples = xorSamples;

        window.costLogger = [];

        function createNetwork() {
            network = new Network([
                new InputLayer(2),
                new Layer(4),
                new Layer(4),
                new OutputLayer(1)
            ]);
            
            networkGraph = new NetworkGraph(network);
            window.networkGraph = networkGraph;
            window.network = network;
            
            return network;
        }

        function updateDisplay() {
            const svg = document.querySelector("svg");
            svg.innerHTML = "";
            svg.appendChild(networkGraph.toSVG(0, 0, 1000, 400));
            svg.appendChild(networkGraph.getConnections());

            // Update chart (only if Chart.js is loaded)
            if (typeof chart !== 'undefined') {
                chart.data.labels = Array.from({ length: window.costLogger.length }, (_, i) => i + 1);
                chart.data.datasets[0].data = window.costLogger;
                chart.update();
            }

            // Update epoch display
            document.getElementById("epochCount").textContent = epoch;

            // Update current loss display
            const currentLoss = window.costLogger.length > 0 
                ? window.costLogger[window.costLogger.length - 1].toFixed(6) 
                : "N/A";
            document.getElementById("currentLoss").textContent = currentLoss;

            // Update predictions table
            updatePredictionsTable();
        }

        function updatePredictionsTable() {
            const tbody = document.getElementById("predictionsBody");
            tbody.innerHTML = "";

            currentSamples.forEach((sample, idx) => {
                network.feedforward(sample);
                const prediction = network.lastLayer().neurons[0].value();
                const error = Math.abs(prediction - sample.target);
                const isCorrect = error < 0.3;

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>[${sample.input.join(", ")}]</td>
                    <td>${sample.target}</td>
                    <td class="${isCorrect ? 'correct' : 'incorrect'}">${prediction.toFixed(4)}</td>
                    <td class="${isCorrect ? 'correct' : 'incorrect'}">${error.toFixed(4)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function trainStep() {
            const learningRate = parseFloat(document.getElementById("learningRate").value);
            network.samples = currentSamples;
            
            // Perform training
            let totalDiff = 0;
            currentSamples.forEach(sample => {
                network.setTrainingSample(sample);
                const diff = network.lastLayer().feedforward(sample.target);
                totalDiff += diff ** 2;
                network.backpropagate(diff, learningRate);
            });

            const cost = totalDiff / (2 * currentSamples.length);
            window.costLogger.push(cost);
            epoch++;

            // Display the current sample being processed
            const currentSampleIdx = epoch % currentSamples.length;
            network.feedforward(currentSamples[currentSampleIdx]);

            updateDisplay();

            // Auto-stop if loss is very small
            if (cost < 0.0001) {
                stopTraining();
                document.getElementById("statusText").textContent = "✓ Training Complete!";
                document.getElementById("statusText").style.color = "#10b981";
            }
        }

        function startTraining() {
            if (isTraining) return;
            isTraining = true;
            
            const speed = parseInt(document.getElementById("trainingSpeed").value);
            
            document.getElementById("startBtn").disabled = true;
            document.getElementById("stopBtn").disabled = false;
            document.getElementById("statusText").textContent = "Training...";
            document.getElementById("statusText").style.color = "#f59e0b";

            trainingInterval = setInterval(trainStep, speed);
        }

        function stopTraining() {
            if (!isTraining) return;
            isTraining = false;
            
            clearInterval(trainingInterval);
            trainingInterval = null;
            
            document.getElementById("startBtn").disabled = false;
            document.getElementById("stopBtn").disabled = true;
            document.getElementById("statusText").textContent = "⏸ Paused";
            document.getElementById("statusText").style.color = "#f59e0b";
        }

        function resetNetwork() {
            stopTraining();
            epoch = 0;
            window.costLogger = [];
            createNetwork();
            updateDisplay();
            
            document.getElementById("statusText").textContent = "● Ready";
            document.getElementById("statusText").style.color = "#10b981";
        }

        function changeDataset(dataset) {
            stopTraining();
            
            switch(dataset) {
                case 'xor':
                    currentSamples = xorSamples;
                    break;
                case 'and':
                    currentSamples = andSamples;
                    break;
                case 'or':
                    currentSamples = orSamples;
                    break;
                case 'custom':
                    currentSamples = customSamples;
                    break;
            }
            
            resetNetwork();
            updateTrainingDataDisplay();
        }

        function updateTrainingDataDisplay() {
            const container = document.getElementById("trainingDataDisplay");
            container.innerHTML = "";
            
            currentSamples.forEach((sample, idx) => {
                const div = document.createElement("div");
                div.className = "sample-row";
                div.innerHTML = `
                    <span class="sample-label">Sample ${idx + 1}:</span>
                    <input type="number" class="input-field" value="${sample.input[0]}" 
                           onchange="window.updateCustomSample(${idx}, 0, this.value)" step="0.1">
                    <input type="number" class="input-field" value="${sample.input[1]}" 
                           onchange="window.updateCustomSample(${idx}, 1, this.value)" step="0.1">
                    <span class="arrow">→</span>
                    <input type="number" class="output-field" value="${sample.target}" 
                           onchange="window.updateCustomTarget(${idx}, this.value)" step="0.1">
                `;
                container.appendChild(div);
            });
        }

        window.updateCustomSample = function(sampleIdx, inputIdx, value) {
            customSamples[sampleIdx].input[inputIdx] = parseFloat(value);
            if (document.getElementById("datasetSelect").value === 'custom') {
                currentSamples = customSamples;
            }
        };

        window.updateCustomTarget = function(sampleIdx, value) {
            customSamples[sampleIdx].target = parseFloat(value);
            if (document.getElementById("datasetSelect").value === 'custom') {
                currentSamples = customSamples;
            }
        };

        window.addEventListener("load", () => {
            createNetwork();
            
            const svg = document.querySelector("svg");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "100%");
            
            updateDisplay();
            updateTrainingDataDisplay();

            // Bind controls
            document.getElementById("startBtn").addEventListener("click", startTraining);
            document.getElementById("stopBtn").addEventListener("click", stopTraining);
            document.getElementById("resetBtn").addEventListener("click", resetNetwork);
            document.getElementById("stepBtn").addEventListener("click", () => {
                if (!isTraining) trainStep();
            });
            document.getElementById("datasetSelect").addEventListener("change", (e) => {
                changeDataset(e.target.value);
            });

            // Learning rate display update
            document.getElementById("learningRate").addEventListener("input", (e) => {
                document.getElementById("lrValue").textContent = e.target.value;
            });

            // Training speed display update
            document.getElementById("trainingSpeed").addEventListener("input", (e) => {
                document.getElementById("speedValue").textContent = e.target.value + "ms";
                if (isTraining) {
                    stopTraining();
                    startTraining();
                }
            });
        });

        window.addEventListener("resize", () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(updateDisplay, 200);
        });

        window.addEventListener("mouseover", (e) => {
            if (e.target.tagName === "circle") {
                popup(e.clientX, e.clientY, e.target.dataset);
            } else {
                let popup = document.querySelector(".popup");
                if (popup) {
                    popup.classList.add("hidden");
                }
            }
        });
    </script>

            border: 1px solid var(--border);
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            animation: status-pulse 2s ease-in-out infinite;
        }

        @keyframes status-pulse {
            0%, 100% { 
                opacity: 1; 
                box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            }
            50% { 
                opacity: 0.7; 
                box-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
            }
        }

        #statusText {
            font-weight: 600;
            font-size: 1em;
            letter-spacing: 0.02em;
        }

        .stat-box {
            background: linear-gradient(135deg, var(--bg-elevated), rgba(30, 41, 59, 0.4));
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        .stat-box .value {
            font-size: 2.4em;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .stat-box .label {
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 8px;
        }

        /* Predictions Table */
        .predictions-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            font-size: 0.85em;
        }

        .predictions-table th {
            padding: 12px 8px;
            text-align: center;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75em;
            letter-spacing: 0.1em;
        }

        .predictions-table td {
            padding: 12px 8px;
            text-align: center;
            background: var(--bg-elevated);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .predictions-table tr td:first-child {
            border-radius: 8px 0 0 8px;
        }

        .predictions-table tr td:last-child {
            border-radius: 0 8px 8px 0;
        }

        .predictions-table .correct {
            color: var(--success);
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .predictions-table .incorrect {
            color: var(--danger);
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        /* Training Data Section */
        .training-data-section {
            margin-top: 8px;
        }

        .sample-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 10px 12px;
            background: var(--bg-elevated);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .sample-row:hover {
            border-color: rgba(139, 92, 246, 0.3);
        }

        .sample-label {
            font-size: 0.8em;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 55px;
        }

        .input-field, .output-field {
            width: 48px;
            padding: 8px 6px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--text-primary);
            text-align: center;
            font-size: 0.9em;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .input-field:focus, .output-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .arrow {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }

        .popup {
            pointer-events: none;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-elevated);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* Responsive Design */
        @media (max-width: 1400px) {
            .container {
                grid-template-columns: 280px 1fr 300px;
                gap: 16px;
                padding: 16px;
            }
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                height: auto;
                min-height: 100vh;
            }
            
            .control-panel {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 16px;
            }

            .stats-panel {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
            }

            header h1 {
                font-size: 1.8em;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
                gap: 12px;
            }

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 1.4em;
            }

            .panel {
                padding: 16px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 0.85em;
            }

            .stat-box .value {
                font-size: 1.8em;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                color: black;
            }

            .panel {
                background: white;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="logo-icon">🧠</span>NeuralNet Studio<span class="badge">Live</span></h1>
            <p>Experience neural network learning in real-time • Configure, train, and visualize</p>
        </header>

        <div class="panel control-panel">
            <h3><span class="icon">⚙️</span> Controls</h3>
            
            <div class="control-group">
                <label>Dataset</label>
                <select id="datasetSelect">
                    <option value="xor">🔀 XOR Gate (Classic)</option>
                    <option value="and">🔗 AND Gate</option>
                    <option value="or">⚡ OR Gate</option>
                    <option value="custom">✏️ Custom</option>
                </select>
            </div>

            <div class="control-group">
                <label>Learning Rate <span id="lrValue">0.1</span></label>
                <input type="range" id="learningRate" min="0.001" max="1" step="0.001" value="0.1">
            </div>

            <div class="control-group">
                <label>Training Speed <span id="speedValue">50ms</span></label>
                <input type="range" id="trainingSpeed" min="10" max="500" step="10" value="50">
            </div>

            <div class="btn-group">
                <button class="btn btn-start" id="startBtn">▶ Start</button>
                <button class="btn btn-stop" id="stopBtn" disabled>⏹ Stop</button>
            </div>

            <div class="btn-group">
                <button class="btn btn-step" id="stepBtn">⏭ Step</button>
                <button class="btn btn-reset" id="resetBtn">↺ Reset</button>
            </div>

            <div class="control-group training-data-section">
                <h3><span class="icon">📊</span> Training Data</h3>
                <div id="trainingDataDisplay"></div>
            </div>
        </div>

        <div class="panel network-container">
            <h3><span class="icon">🔗</span> Network Visualization</h3>
            <div class="svg-container">
                <svg viewBox="0 0 1000 400"></svg>
            </div>
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <div class="panel stats-panel">
            <h3><span class="icon">📈</span> Statistics</h3>
            
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="statusText" style="color: #10b981;">Ready</span>
            </div>

            <div class="stat-box">
                <div class="value" id="epochCount">0</div>
                <div class="label">Epochs</div>
            </div>

            <div class="stat-box">
                <div class="value" id="currentLoss">N/A</div>
                <div class="label">Current Loss</div>
            </div>

            <div class="control-group">
                <h3><span class="icon">🎯</span> Predictions</h3>
                <table class="predictions-table">
                    <thead>
                        <tr>
                            <th>Input</th>
                            <th>Target</th>
                            <th>Output</th>
                            <th>Error</th>
                        </tr>
                    </thead>
                    <tbody id="predictionsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="popup hidden"></div>

    <script>
        let chart;
        try {
            const ctx = document.getElementById('myChart');

            if (typeof Chart !== 'undefined') {
                Chart.defaults.backgroundColor = 'transparent';
                Chart.defaults.borderColor = 'rgba(148, 163, 184, 0.1)';
                Chart.defaults.color = '#94a3b8';

                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: "Loss (MSE)",
                            data: window.costLogger,
                            borderColor: "#8b5cf6",
                            backgroundColor: "rgba(139, 92, 246, 0.1)",
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            pointHoverBackgroundColor: "#8b5cf6"
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        interaction: {
                            intersect: false,
                            mode: 'index'
                        },
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    color: '#94a3b8',
                                    font: { 
                                        size: 11,
                                        family: "'Inter', sans-serif",
                                        weight: 500
                                    },
                                    boxWidth: 12,
                                    boxHeight: 12,
                                    borderRadius: 3
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                                titleColor: '#f1f5f9',
                                bodyColor: '#94a3b8',
                                borderColor: 'rgba(139, 92, 246, 0.3)',
                                borderWidth: 1,
                                cornerRadius: 8,
                                padding: 12,
                                titleFont: { family: "'Inter', sans-serif", weight: 600 },
                                bodyFont: { family: "'JetBrains Mono', monospace" }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { 
                                    color: 'rgba(148, 163, 184, 0.08)',
                                    drawBorder: false
                                },
                                ticks: { 
                                    color: "#64748b", 
                                    font: { 
                                        size: 10,
                                        family: "'JetBrains Mono', monospace"
                                    }
                                }
                            },
                            x: {
                                grid: { 
                                    color: 'rgba(148, 163, 184, 0.08)',
                                    drawBorder: false
                                },
                                ticks: {
                                    autoSkip: true,
                                    maxTicksLimit: 8,
                                    maxRotation: 0,
                                    color: "#64748b",
                                    font: { 
                                        size: 10,
                                        family: "'JetBrains Mono', monospace"
                                    }
                                }
                            }
                        }
                    }
                });
            } else {
                console.log('Chart.js not available, loss chart will not be displayed');
                document.querySelector('.chart-container').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#64748b;font-size:0.9em;">📊 Loss chart requires Chart.js</div>';
            }
        } catch (e) {
            console.log('Chart initialization error:', e);
        }
    </script>
</body>
</html>
