apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuralnetjs-ingress
  namespace: neuralnetjs
  labels:
    app: neuralnetjs
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: neuralnetjs.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuralnetjs-service
                port:
                  number: 80
  # Uncomment for TLS
  # tls:
  #   - hosts:
  #       - neuralnetjs.local
  #     secretName: neuralnetjs-tls
