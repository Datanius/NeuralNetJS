version: '3.8'

services:
  neuralnetjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "app=neuralnetjs"
      - "version=1.0.0"

  # Optional: Add a reverse proxy with SSL (uncomment if needed)
  # traefik:
  #   image: traefik:v2.10
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--entrypoints.web.address=:80"
  #   ports:
  #     - "80:80"
  #     - "8081:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  default:
    name: neuralnetjs-network
    driver: bridge
